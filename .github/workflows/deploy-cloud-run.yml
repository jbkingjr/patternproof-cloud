name: PatternProof Cloud Run deployment (requires GCP configuration)
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build, push, and deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?Set GCP_PROJECT_ID}" "${REGION:?Set GCP_REGION}" "${REPOSITORY:?Set GCP_ARTIFACT_REPOSITORY}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/patternproof:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          gcloud run deploy patternproof-cloud \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --port 8080 \
            --no-allow-unauthenticated \
            --quiet
